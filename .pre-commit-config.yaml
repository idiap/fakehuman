repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # Lint without automatic fixes: the manifest pins five runtime source hashes.
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: debug-statements
      - id: check-case-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Preserve license texts, packaged data and manifest-pinned source bytes.
        exclude: &frozen_files ^(LICENSE$|LICENSES/|src/fakehuman/data/|src/fakehuman/(rules|candidates_lexical|candidates_structural|research_rules|meaning)\.py$)
      - id: end-of-file-fixer
        exclude: *frozen_files

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        always_run: true
